<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【姓名】- 求职简历</title>
<!-- 现代专业风 · 蓝紫主调 · 分栏布局 · 通用/商务岗 -->
<style>
:root{
  --primary:#5b5bd6;     /* 主色 */
  --primary-dark:#3f3fb0;
  --accent:#8b5cf6;      /* 点缀色 */
  --bg:#f4f5fb;
  --card:#ffffff;
  --text:#22223a;
  --muted:#6b6b86;
  --line:#e4e6f2;
  --radius:14px;
  --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;padding:32px 16px;}
.page{max-width:880px;margin:0 auto;background:var(--card);border-radius:var(--radius);box-shadow:0 10px 40px rgba(60,60,140,.12);overflow:hidden;}
.header{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;padding:40px 44px;}
.header h1{font-size:34px;letter-spacing:1px;}
.header .role{margin-top:8px;font-size:18px;opacity:.95;}
.header .tagline{margin-top:14px;font-size:14px;max-width:560px;}
.header .meta{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;font-size:13px;}
.header .meta span{background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;}
.body{padding:36px 44px;}
section{margin-bottom:30px;}
section h2{font-size:18px;color:var(--primary-dark);border-left:4px solid var(--primary);padding-left:12px;margin-bottom:16px;}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;}
.item{margin-bottom:18px;}
.item .time{font-size:12px;color:var(--muted);}
.item .org{font-weight:700;}
.item .desc{font-size:14px;color:var(--muted);margin-top:4px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;}
.tags span{background:var(--bg);border:1px solid var(--line);color:var(--primary-dark);padding:4px 12px;border-radius:999px;font-size:13px;}
.edu p{font-size:14px;color:var(--muted);}
@media(max-width:680px){.grid{grid-template-columns:1fr;}.body,.header{padding:28px 24px;}}
@media print{body{background:#fff;padding:0;} .page{box-shadow:none;border-radius:0;}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>【姓名】</h1>
    <div class="role">【求职意向】</div>
    <div class="tagline">【一句话个人定位：擅长某领域 X，为团队带来 Y 结果】</div>
    <div class="meta">
      <span>📍 【城市】</span>
      <span>✉️ 【邮箱】</span>
      <span>📞 【电话】</span>
      <span>🔗 【作品/博客，可选】</span>
    </div>
  </div>
  <div class="body">
    <div class="grid">
      <div>
        <section>
          <h2>工作 / 项目经历</h2>
          <div class="item">
            <div class="time">【2022.03 — 至今】</div>
            <div class="org">【公司 / 项目名】 · 【职位】</div>
            <div class="desc">· 【动作 + 量化成果，如：重构核心模块，性能提升 40%】</div>
            <div class="desc">· 【第二项成果】</div>
          </div>
          <div class="item">
            <div class="time">【2020.06 — 2022.02】</div>
            <div class="org">【公司 / 项目名】 · 【职位】</div>
            <div class="desc">· 【成果】</div>
          </div>
        </section>
      </div>
      <div>
        <section>
          <h2>技能栈</h2>
          <div class="tags">
            <span>【技能 A】</span><span>【技能 B】</span><span>【技能 C】</span>
          </div>
        </section>
        <section>
          <h2>教育背景</h2>
          <div class="item">
            <div class="org">【学校】 · 【专业】</div>
            <div class="edu">【学位】 · 【年份】</div>
          </div>
        </section>
        <section>
          <h2>亮点 / 作品</h2>
          <div class="item"><div class="desc">【可展示的成就或作品链接】</div></div>
        </section>
      </div>
    </div>
  </div>
</div>
</body>
</html>
