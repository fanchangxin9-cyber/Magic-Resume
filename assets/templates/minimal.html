<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【姓名】- 求职简历</title>
<!-- 极简设计风 · 黑白大留白 · 网格对齐 · 技术/工程岗 -->
<style>
:root{
  --ink:#111111;
  --muted:#666666;
  --line:#e5e5e5;
  --bg:#ffffff;
  --fat:2.5px; /* 加固的粗线 */
  --font:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono','PingFang SC',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.7;padding:48px 24px;}
.page{max-width:760px;margin:0 auto;}
.top{border-top:var(--fat) solid var(--ink);padding-top:22px;margin-bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.name{font-size:44px;font-weight:900;letter-spacing:2px;}
.sub{font-size:16px;color:var(--muted);margin-top:6px;}
.meta{text-align:right;font-size:13px;color:var(--muted);line-height:1.8;}
.row{display:grid;grid-template-columns:120px 1fr;gap:20px;margin-bottom:26px;}
.row h2{font-size:14px;letter-spacing:2px;padding-top:2px;}
.sep{height:var(--fat);background:var(--ink);margin:2px 0 16px;}
.content .item{margin-bottom:18px;}
.content .time{font-size:12px;color:var(--muted);letter-spacing:1px;}
.content .org{font-weight:700;font-size:15px;}
.content .desc{font-size:13.5px;color:var(--muted);margin-top:4px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tags span{border:1px solid var(--ink);padding:2px 10px;font-size:12.5px;border-radius:2px;}
.mono-note{font-size:12px;color:var(--muted);letter-spacing:1px;}
@media(max-width:600px){.row{grid-template-columns:1fr;gap:6px;} .meta{text-align:left;}}
@media print{body{padding:0;}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <div class="name">【姓名】</div>
      <div class="sub">【求职意向】 · 【一句话定位】</div>
    </div>
    <div class="meta">
      【城市】<br>【邮箱】<br>【电话】
    </div>
  </div>

  <div class="row">
    <h2>经历</h2>
    <div class="content">
      <div class="sep"></div>
      <div class="item">
        <div class="time">[2022.03 — 至今]</div>
        <div class="org">公司 / 项目 · 职位</div>
        <div class="desc">· 动作 + 量化成果</div>
        <div class="desc">· 第二项成果</div>
      </div>
      <div class="item">
        <div class="time">[2020.06 — 2022.02]</div>
        <div class="org">公司 / 项目 · 职位</div>
        <div class="desc">· 成果</div>
      </div>
    </div>
  </div>

  <div class="row">
    <h2>技能</h2>
    <div class="content">
      <div class="sep"></div>
      <div class="tags">
        <span>技能 A</span><span>技能 B</span><span>技能 C</span>
      </div>
    </div>
  </div>

  <div class="row">
    <h2>教育</h2>
    <div class="content">
      <div class="sep"></div>
      <div class="item">
        <div class="org">学校 · 专业</div>
        <div class="desc">学位 · 年份</div>
      </div>
    </div>
  </div>

  <div class="row">
    <h2>作品</h2>
    <div class="content">
      <div class="sep"></div>
      <div class="desc mono-note">~ 链接 / 开源项目 / 案例</div>
    </div>
  </div>

  <div style="margin-top:30px;border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--muted);letter-spacing:1px;">
    // 神奇简历 · Magic Resume · generated with style:minimal
  </div>
</div>
</body>
</html>
