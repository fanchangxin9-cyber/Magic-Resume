<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【姓名】- 求职简历</title>
<!-- 个性创意风 · 大胆撞色 · 卡片布局 · 设计/创意岗 -->
<style>
:root{
  --bg:#0d0d1a;          /* 深色背景 */
  --card:#16162b;
  --ink:#f5f5ff;
  --pink:#ff4fa3;        /* 撞色 1 */
  --cyan:#22e0c8;        /* 撞色 2 */
  --yellow:#ffe066;
  --radius:22px;
  --font:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;padding:24px;}
.page{max-width:880px;margin:0 auto;}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:14px 6px 20px;}
.hero .name{font-size:52px;font-weight:900;line-height:1;letter-spacing:1px;
  background:linear-gradient(90deg,var(--pink),var(--yellow),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.hero .role{font-size:20px;color:var(--cyan);margin-top:10px;}
.sticker{font-size:14px;background:var(--card);border:2px solid var(--pink);padding:8px 16px;border-radius:999px;white-space:nowrap;}
.badge-row{display:flex;flex-wrap:wrap;gap:10px;padding:0 6px 18px;}
.badge{font-size:13px;padding:6px 14px;border-radius:999px;}
.b-pink{background:var(--pink);color:#12080f;}
.b-cyan{background:var(--cyan);color:#062a28;}
.b-yellow{background:var(--yellow);color:#3a3200;}
.card{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:16px;
  border:1px solid rgba(255,255,255,.06);}
.card h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:10px;color:var(--yellow);}
.card h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--pink);}
.item{margin-bottom:16px;}
.item .time{font-size:12px;color:#9a9ac0;}
.item .org{font-weight:700;color:var(--ink);}
.item .desc{font-size:14px;color:#b8b8d8;margin-top:4px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;}
.tags span{background:rgba(34,224,200,.12);border:1px solid rgba(34,224,200,.4);color:var(--cyan);
  padding:4px 12px;border-radius:999px;font-size:13px;}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
@media(max-width:680px){.two{grid-template-columns:1fr;} .hero{flex-direction:column;align-items:flex-start;} .hero .name{font-size:38px;}}
@media print{body{background:#fff;color:#111;padding:0;} .card{background:#fff;border:1px solid #ddd;} .item .desc,.tags span{color:#333;}}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div>
      <div class="name">【姓名】</div>
      <div class="role">【求职意向】</div>
      <div class="sticker" style="margin-top:12px;display:inline-block;">✨ 【一句话创意定位】</div>
    </div>
    <div class="badge-row" style="padding:0;">
      <span class="badge b-pink">📍 城市</span>
      <span class="badge b-cyan">✉️ 邮箱</span>
      <span class="badge b-yellow">📞 电话</span>
    </div>
  </div>

  <div class="two">
    <div>
      <div class="card">
        <h2>经历 / 项目</h2>
        <div class="item">
          <div class="time">【2022.03 — 至今】</div>
          <div class="org">【公司 / 项目】 · 【职位】</div>
          <div class="desc">· 【动作 + 量化成果】</div>
          <div class="desc">· 【第二项成果】</div>
        </div>
        <div class="item">
          <div class="time">【2020.06 — 2022.02】</div>
          <div class="org">【公司 / 项目】 · 【职位】</div>
          <div class="desc">· 【成果】</div>
        </div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>技能栈</h2>
        <div class="tags">
          <span>技能 A</span><span>技能 B</span><span>技能 C</span><span>技能 D</span>
        </div>
      </div>
      <div class="card">
        <h2>教育背景</h2>
        <div class="item"><div class="org">【学校】 · 【专业】</div>
        <div class="desc">【学位 · 年份】</div></div>
      </div>
      <div class="card">
        <h2>作品集</h2>
        <div class="desc">【链接 1】 · 【链接 2】</div>
      </div>
    </div>
  </div>

  <div class="card" style="border-color:var(--pink);">
    <h2>亮点成就</h2>
    <div class="desc">【用数字说话的亮点，如：主导 XX 上线，用户增长 3 倍】</div>
  </div>
</div>
</body>
</html>
